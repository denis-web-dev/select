<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom dropdown. CSS + JS</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <h1>Select. Выпадающий список</h1>

    <div class="form-group-title">
        Бюджет проекта
    </div>

    <div class="form-group">
        <div class="dropdown">
            <button class="dropdown__button">Любой</button>
            <div class="caret">
                <svg class="caret-svg" width="15" height="11" viewBox="0 0 15 11" xmlns="http://www.w3.org/2000/svg">

                    <path
                        d="M12.2376 1.12019e-05H2.76506C2.3911 -0.000530268 2.02463 0.104844 1.70807 0.30394C1.3915 0.503035 1.1378 0.787708 0.976314 1.12501C0.787277 1.52522 0.714468 1.97048 0.766183 2.41006C0.817898 2.84964 0.992057 3.26585 1.26881 3.61126L6.00506 9.34876C6.19093 9.56322 6.42073 9.73522 6.67888 9.8531C6.93704 9.97098 7.21752 10.032 7.50131 10.032C7.78511 10.032 8.06559 9.97098 8.32374 9.8531C8.5819 9.73522 8.8117 9.56322 8.99756 9.34876L13.7338 3.61126C14.0106 3.26585 14.1847 2.84964 14.2364 2.41006C14.2882 1.97048 14.2154 1.52522 14.0263 1.12501C13.8648 0.787708 13.6111 0.503035 13.2946 0.30394C12.978 0.104844 12.6115 -0.000530268 12.2376 1.12019e-05Z" />
                </svg>
            </div>
            <ul class="dropdown__list">
                <li class="dropdown__list-item item" data-value="num-0">Любой</li>
                <li class="dropdown__list-item item" data-value="num-1">Менее 5 000 ₽</li>
                <li class="dropdown__list-item item" data-value="num-2">5 000 - 20 000 ₽</li>
                <li class="dropdown__list-item item" data-value="num-3">20 000 - 50 000 ₽</li>
                <li class="dropdown__list-item item" data-value="num-4">50 000 - 100 000 ₽</li>
                <li class="dropdown__list-item item" data-value="num-5">Более 100 000 ₽</li>
            </ul>
            <input type="text" name="select-category" value="" class="dropdown__input-hidden">
        </div>
    </div>

    <script src="main.js"></script>

</body>

</html>
